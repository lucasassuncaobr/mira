services:
  prodata-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodata-agent
    volumes:
      - .:/app
      - memoria:/app/memoria
      - dados:/app/dados
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  memoria:
  dados:
  ollama_data:
