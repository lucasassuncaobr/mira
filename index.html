<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira - Estudos</title>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/rawline">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-text">Mira</span>
                <span class="logo-subtitle">ESTUDOS</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-item active">
                    <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Provas
                </a>
                <a href="#" class="nav-item">
                    <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    Desempenho
                </a>
            </nav>
        </div>
        <div class="header-right">
            <div class="user-profile">
                <div class="user-avatar">LA</div>
                <span class="user-name">Lucas</span>
                <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="pdf-panel">
            <div class="pdf-header">
                <svg class="pdf-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                <span class="pdf-title">Questão 1 no PDF</span>
            </div>
            <div class="pdf-viewer">
                <div class="pdf-content">
                    <div class="pdf-page" id="pdf-content">
                        <p>Carregando questão...</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="question-panel">
            <div class="question-header">
                <h2 class="question-number">Questão 1</h2>
                <div class="clock-container">
                    <div class="clock-inner">
                        <svg class="clock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span class="clock-label">TEMPO DE PROVA</span>
                        <span class="clock-time" id="clock-time">02:00:00</span>
                    </div>
                </div>
            </div>

            <div class="question-index">
                <div class="index-header">
                    <span class="index-title">ÍNDICE DE QUESTÕES</span>
                    <span class="index-count">1/10</span>
                </div>
                <div class="index-grid" id="index-grid"></div>
            </div>

            <div class="answer-section" id="answer-section">
                <h3 class="answer-title">ESCOLHA UMA RESPOSTA</h3>
                <div class="option" data-option="A"><div class="option-letter">A</div><div class="option-text"></div></div>
                <div class="option" data-option="B"><div class="option-letter">B</div><div class="option-text"></div></div>
                <div class="option" data-option="C"><div class="option-letter">C</div><div class="option-text"></div></div>
                <div class="option" data-option="D"><div class="option-letter">D</div><div class="option-text"></div></div>
                <div class="option" data-option="E"><div class="option-letter">E</div><div class="option-text"></div></div>
            </div>

            <div class="feedback" id="feedback" style="display:none;"></div>

            <div class="bottom-nav" id="bottom-nav">
                <div class="nav-arrows">
                    <button class="nav-arrow" id="prev-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <button class="nav-arrow" id="next-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
                <button class="btn-respond" id="respond-btn">Responder</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
