services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: lucasassuncao/mira-api:latest
    container_name: mira-api
    ports:
      - "3333:3333"
    volumes:
      - ./data:/app/data
    restart: always
    environment:
      - PORT=3333

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: lucasassuncao/mira-web:latest
    container_name: mira-web
    ports:
      - "5173:80"
    restart: always
    depends_on:
      - api
