<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="pt-BR" />
    <title>Mira</title>
    <script>window.__MIRA_API__ = 'http://localhost:3333/api';</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/css/styles.css?v=6" />
    <link rel="stylesheet" href="/assets/css/theme.css?v=6" />
    <link rel="stylesheet" href="/assets/css/theme-polish.css?v=6" />
    <link rel="stylesheet" href="/assets/css/compact.css?v=8" />
    <link rel="stylesheet" href="/assets/css/pdf-modal.css?v=6" />
    <link rel="stylesheet" href="/assets/css/focus.css?v=2" />
    <link rel="stylesheet" href="/assets/css/mobile.css" />
    <link rel="stylesheet" href="/assets/css/navbar.css?v=6" />
    <link rel="stylesheet" href="/assets/css/gran.css?v=44" />
    <script type="importmap">
      { "imports": { "pdfjs-dist": "/assets/vendor/pdf.mjs", "alpinejs": "/assets/vendor/alpine.module.mjs" } }
    </script>
    <script type="module" src="/assets/js/app.js?v=18"></script>
  </head>
  <body class="notranslate">
    <div id="root" class="notranslate" translate="no" x-data :class="'app-shell view-' + $store.app.view">
      <div class="topbar" x-data="{ navOpen: false }" x-on:keydown.escape.window="navOpen = false" x-on:click.away="navOpen = false" :class="{ 'nav-open': navOpen }"><div class="topbar-inner">
        <button class="nav-toggle" type="button" aria-label="Abrir menu de navegação" :aria-expanded="navOpen" :class="{ 'open': navOpen }" x-on:click="navOpen = !navOpen">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path x-show="navOpen" fill-rule="evenodd" clip-rule="evenodd" d="M18.278 16.864a1 1 0 0 1-1.414 1.414l-4.829-4.828-4.828 4.828a1 1 0 0 1-1.414-1.414l4.828-4.829-4.828-4.828a1 1 0 0 1 1.414-1.414l4.829 4.828 4.828-4.828a1 1 0 1 1 1.414 1.414l-4.828 4.829 4.828 4.828z" />
            <path x-show="!navOpen" fill-rule="evenodd" d="M4 5h16a1 1 0 0 1 0 2H4a1 1 0 1 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2z" />
          </svg>
        </button>
        <div class="brand"><div class="brand-lockup"><span class="brand-name">Mira</span><small>estudos</small></div></div>
        <div class="nav-menu" :class="{ 'open': navOpen }">
        <nav>
          <button :class="$store.app.view === 'exams' ? 'nav active' : 'nav'" x-on:click="navOpen = false; $store.app.setView('exams')"><span>Provas</span></button>
          <button :class="$store.app.view === 'performance' ? 'nav active' : 'nav'" x-on:click="navOpen = false; $store.app.setView('performance')"><span>Desempenho</span></button>
          <button :class="$store.app.view === 'import' ? 'nav active' : 'nav'" x-on:click="navOpen = false; $store.app.setView('import')"><span>Importar</span></button>
        </nav>
        <div class="profile"><div class="avatar">LA</div><div><strong>Lucas</strong></div>
        </div>
        </div>
      </div></div>
      <main>
        <header><div><span class="eyebrow">PLATAFORMA DE ESTUDOS</span><h1 x-text="$store.app.titles[$store.app.view]"></h1></div></header>
        <template x-if="$store.app.error">
          <div class="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span x-text="$store.app.error"></span></div>
        </template>

        <!-- DASHBOARD / PROVAS (estilo Gran: hero + filtros + lista) -->
        <template x-if="$store.app.view === 'dashboard' || $store.app.view === 'exams'">
          <section class="gran-provas" x-data="dashboardComponent()" x-init="init()">
            <div class="gran-hero"><div class="gran-hero-inner">
              <nav class="gran-crumbs" aria-label="Navegação estrutural"><button x-on:click="$store.app.setView('exams')">Início</button><span aria-hidden="true">/</span><strong>Provas</strong></nav>
              <div class="gran-hero-row">
                <h2>Provas de Concursos</h2>
                <div class="gran-hero-action">
                  <p>A ferramenta definitiva e sem custo nenhum para você subir provas com gabarito e ver sua evolução.</p>
                  <button class="gran-hero-cta" x-on:click="$store.app.setView('import')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>
                    Enviar prova e gabarito
                  </button>
                </div>
              </div>
            </div></div>
            <div class="stats">
              <div class="stat stat-blue"><div class="stat-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div><strong x-text="exams.length"></strong><span>Provas importadas</span></div></div>
              <div class="stat stat-green"><div class="stat-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div><div><strong x-text="answered"></strong><span>Questões resolvidas</span></div></div>
              <div class="stat stat-neutral"><div class="stat-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div><strong x-text="studyTime"></strong><span>Tempo de estudo</span></div></div>
              <div class="stat" :class="'stat-' + tone"><div class="stat-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg></div><div><strong x-text="answered ? accuracy + '%' : '—'"></strong><span>Taxa de acerto</span></div></div>
            </div>
            <div class="gran-cols">
              <aside class="gran-side">
              <div class="gran-filters" :class="{ 'open': filtersOpen }">
                <div class="gran-filters-head">
                  <h3>Filtros</h3>
                  <div>
                    <button class="gran-filters-toggle" x-on:click="filtersOpen = !filtersOpen" :aria-expanded="filtersOpen" x-text="filtersOpen ? 'Ocultar' : 'Exibir'"></button>
                    <button class="gran-clear" x-on:click="clearFilters()">Limpar</button>
                  </div>
                </div>
                <div class="gran-filters-body">
                  <label class="gran-field"><span>Palavra-chave</span><input type="search" placeholder="Buscar prova..." x-model="q" /></label>
                  <label class="gran-field"><span>Banca</span><select x-model="fBoard"><option value="">Todas</option><template x-for="b in boards" :key="b"><option :value="b" x-text="b"></option></template></select></label>
                  <label class="gran-field"><span>Situação</span><select x-model="fStatus"><option value="">Todas</option><option value="todo">Não iniciadas</option><option value="doing">Em andamento</option><option value="done">Concluídas</option></select></label>
                  <label class="gran-field"><span>Ano</span><select x-model="fYear"><option value="">Todos</option><template x-for="y in years" :key="y"><option :value="y" x-text="y"></option></template></select></label>
                  <label class="gran-field"><span>Ordenar por</span><select x-model="fSort"><option value="recent">Mais recentes</option><option value="progress">Mais progresso</option><option value="name">Nome (A–Z)</option></select></label>
                </div>
              </div>
              <section class="side-card quick-performance glance-performance"><div class="side-title"><div><span class="eyebrow">DESEMPENHO</span><h3>Resumo atual</h3></div></div><strong x-text="answered ? accuracy + '%' : '—'"></strong><span>Aproveitamento geral</span><div class="quick-track"><i :style="'width: ' + accuracy + '%'"></i></div><small x-text="correct + ' acertos em ' + answered + ' resoluções'"></small></section>
              </aside>
              <div class="gran-main">
                <div class="gran-list-head"><div><span class="eyebrow">BIBLIOTECA</span><h3>Suas provas</h3></div><div class="gran-list-side"><span class="gran-count" x-text="filtered.length === 1 ? '1 prova encontrada' : filtered.length + ' provas encontradas'"></span><template x-if="resume"><button class="gran-continue" x-on:click="$store.app.openExam(resume.id, 'solve')">Continuar <b x-text="resume.title"></b> · <span x-text="resume.answered_count + '/' + resume.question_count"></span> ›</button></template></div></div>
                <div class="exam-list gran-list dashboard-exams">
                  <template x-for="exam in paged" :key="exam.id">
                    <article class="exam-card-v2" :class="statsOf(exam).done && 'is-completed'" x-on:click="openCard(exam.id)" x-on:keydown.enter="openCard(exam.id)" tabindex="0">
                      <div class="exam-card-visual">
                        <template x-if="exam.logo">
                          <img class="exam-card-logo" :src="logoURL(exam.logo)" alt="" />
                        </template>
                        <template x-if="!exam.logo">
                          <div class="exam-card-icon ecv2-teal" x-html="icons.fileText"></div>
                        </template>
                        <div class="exam-card-visual-title"><h3 x-text="shortTitle(exam.title)" :title="exam.title"></h3></div>
                      </div>
                      <div class="exam-card-content"><div class="exam-card-content-inner">
                        <div class="exam-card-info-box">
                          <template x-if="exam.created_at">
                            <span><b>Prova:</b> <strong class="card-number" x-text="fmtDate(exam.created_at)"></strong></span>
                          </template>
                          <template x-if="exam.board">
                            <span><b>Banca:</b> <span x-text="exam.board"></span></span>
                          </template>
                        </div>
                        <div class="exam-card-progress-area"><div class="exam-card-progress-top">
                          <span class="exam-card-progress-text"><strong x-text="pad2(statsOf(exam).a)"></strong> de <span class="progress-total" x-text="pad2(statsOf(exam).t)"></span> <small>resolvidas</small></span>
                          <span class="exam-card-status" x-text="statsOf(exam).done ? 'Concluído' : 'Em andamento'"></span></div>
                          <div class="exam-card-progress-bar"><i :style="'width: ' + statsOf(exam).p + '%'"></i></div></div>
                        <div class="exam-card-stats">
                          <div class="exam-card-stat"><div class="exam-card-stat-icon ecv2-teal" x-html="icons.clipboard"></div><div class="exam-card-stat-info"><strong x-text="statsOf(exam).a"></strong><span>Resolvidas</span></div></div>
                          <div class="exam-card-stat"><div class="exam-card-stat-icon ecv2-green" x-html="icons.check"></div><div class="exam-card-stat-info"><strong x-text="statsOf(exam).c"></strong><span>Acertos</span></div></div>
                          <div class="exam-card-stat"><div class="exam-card-stat-icon ecv2-red" x-html="icons.x"></div><div class="exam-card-stat-info"><strong x-text="statsOf(exam).w"></strong><span>Erros</span></div></div>
                        </div></div>
                      </div>
                      <footer class="exam-card-footer"><div class="exam-card-actions">
                        <button class="exam-card-edit" aria-label="Editar" x-on:click.stop="startEdit(exam)" x-html="icons.pencil"></button>
                        <button class="exam-card-remove" aria-label="Remover" x-on:click.stop="removeCard(exam.id)" x-html="icons.trash"></button>
                      </div><button class="exam-card-cta" x-on:click.stop="openCard(exam.id)">Resolver</button></footer>
                    </article>
                  </template>
                </div>
                <template x-if="editing">
                  <div class="exam-edit-overlay" x-on:click.self="cancelEdit()" x-on:keydown.escape.window="cancelEdit()">
                    <div class="exam-edit-modal">
                      <div class="exam-edit-header"><h3>Editar prova</h3><button class="exam-edit-close" aria-label="Fechar" x-on:click="cancelEdit()" x-html="icons.x"></button></div>
                      <div class="exam-edit-body">
                        <div class="exam-edit-field"><label>Título</label><input type="text" x-model="editing.title" /></div>
                        <div class="exam-edit-field"><label>Banca</label><input type="text" x-model="editing.board" placeholder="Ex: FCC, CESPE, VUNESP..." /></div>
                        <div class="exam-edit-field"><label>Logo da prova</label><div class="exam-edit-logo-area">
                          <template x-if="editing.preview">
                            <img :src="editing.preview" alt="Logo" class="exam-edit-logo-preview" />
                          </template>
                          <label class="exam-edit-upload"><input type="file" accept="image/*" hidden x-on:change="onLogoFile($event)" /><span x-text="editing.preview ? 'Trocar imagem' : 'Selecionar imagem'"></span></label>
                        </div></div>
                      </div>
                      <div class="exam-edit-footer"><button class="exam-edit-cancel" x-on:click="cancelEdit()">Cancelar</button><button class="exam-edit-save" x-on:click="saveEdit()" :disabled="!editing.title.trim() || editSaving" x-text="editSaving ? 'Salvando...' : 'Salvar'"></button></div>
                    </div>
                  </div>
                </template>
                <template x-if="filtered.length > 0">
                  <nav class="gran-pagination" aria-label="Paginação das provas">
                    <button class="gran-page-nav" x-on:click="setPage(page - 1)" :disabled="page <= 1" aria-label="Página anterior">
                      <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" /></svg>
                      <span>Anterior</span>
                    </button>
                    <template x-for="p in pages" :key="p.key">
                      <button :class="p.num === page ? 'gran-page on' : 'gran-page'" :disabled="p.dots" x-on:click="!p.dots && setPage(p.num)" x-text="p.dots ? '…' : p.num" :aria-label="p.dots ? 'Mais páginas' : 'Página ' + p.num" :aria-current="p.num === page && 'page'"></button>
                    </template>
                    <button class="gran-page-nav" x-on:click="setPage(page + 1)" :disabled="page >= totalPages" aria-label="Próxima página">
                      <span>Próxima</span>
                      <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" /></svg>
                    </button>
                  </nav>
                </template>
                <template x-if="!exams.length">
                  <div class="empty provas-empty"><div class="empty-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><h3>Nenhuma prova ainda</h3><p>Importe uma prova com gabarito para criar seu primeiro caderno e começar a acompanhar desempenho.</p><button class="primary" x-on:click="$store.app.setView('import')">Importar primeira prova</button></div>
                </template>
                <template x-if="exams.length && !filtered.length">
                  <div class="empty"><div class="empty-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><h3>Nenhuma prova encontrada</h3><p>Nenhuma prova corresponde aos filtros aplicados.</p><button class="secondary" x-on:click="clearFilters()">Limpar filtros</button></div>
                </template>
              <div class="gran-ritmo">
                <div x-data="heatmapComponent()" x-init="init()" x-html="html"></div>
              </div>
              <footer class="gran-footer">
                <div class="gran-footer-grid">
                  <div><strong class="gran-footer-brand">Mira <span>estudos</span></strong><p>Suas provas, questões e desempenho em um só lugar. Dados salvos localmente.</p></div>
                  <nav aria-label="Estudar"><strong>Estudar</strong><button x-on:click="$store.app.setView('exams')">Provas</button><button x-on:click="$store.app.setView('performance')">Desempenho</button><button x-on:click="$store.app.setView('import')">Importar</button></nav>
                  <div><strong>Sobre</strong><p>Plataforma de estudos com cadernos de questões interativos.</p></div>
                </div>
                <small>© Mira Estudos — uso local</small>
              </footer>
              </div>
            </div>
          </section>
        </template>

        <!-- DESEMPENHO -->
        <template x-if="$store.app.view === 'performance'">
          <section class="performance-page" x-data="performanceComponent()" x-init="init()">
            <div class="performance-controls"><div><b>Exibir</b><span class="control-active">Todas as questões</span></div><div><b>Pontuação</b><button :class="scoreMode === 'normal' ? 'active' : ''" x-on:click="scoreMode = 'normal'">Normal</button><button :class="scoreMode === 'liquid' ? 'active' : ''" x-on:click="scoreMode = 'liquid'">Líquida</button></div></div>
            <div class="notebook-analytics"><aside class="notebook-totals"><h2>Resumo dos cadernos</h2><dl><div><dt>Questões</dt><dd x-text="total"></dd></div><div><dt>Resolvidas</dt><dd x-text="answered"></dd></div><div class="correct-row"><dt>Acertos</dt><dd x-text="correct"></dd></div><div class="wrong-row"><dt>Erros</dt><dd x-text="wrong"></dd></div><div><dt>Em branco</dt><dd x-text="blank"></dd></div></dl><div class="time-totals"><span>Tempo total <b x-text="fmtTime(seconds)"></b></span><span>Tempo médio por questão <b x-text="fmtTime(avgSeconds)"></b></span></div><div class="completion-block"><div><span>Progresso de estudo</span><b x-text="completion + '%'"></b></div><div class="completion-bar"><i :style="'width: ' + completion + '%'"></i></div></div></aside>
            <div class="donut-area" x-html="donutsHtml"></div></div>
            <div class="performance-grid"><article class="performance-panel"><div class="panel-heading"><div><span class="eyebrow">ÚLTIMOS 7 DIAS</span><h2>Evolução</h2></div><span x-text="weekTotal + ' resoluções'"></span></div><div class="weekly-chart" x-html="weekHtml"></div></article>
            <article class="performance-panel comparison"><div class="panel-heading"><div><span class="eyebrow">POR PROVA</span><h2>Seus cadernos</h2></div></div><div class="exam-ranking" x-html="rankingHtml"></div></article></div>
          </section>
        </template>

        <!-- IMPORTAR -->
        <template x-if="$store.app.view === 'import'">
          <div class="panel import-panel" x-data="importComponent()" x-init="init()">
            <div class="steps"><span class="current">1</span><i :class="examFile ? 'done' : ''"></i><span :class="answerFile ? 'current' : ''">2</span><i :class="answerFile ? 'done' : ''"></i><span>3</span></div>
            <div class="center-title"><span class="eyebrow">PROVA + GABARITO</span><h2>Crie uma prova completa</h2><p>Envie os dois PDFs. O título, as questões e as respostas serão identificados automaticamente.</p></div>
            <div class="upload-grid">
              <label :class="examFile ? 'dropzone selected' : 'dropzone'"><input type="file" accept="application/pdf" x-on:change="examFile = $event.target.files[0] ?? null" /><span class="upload-label">1. PDF da prova</span><div class="upload-icon" x-html="examFile ? iconCheck : iconUpload"></div><h3 x-text="examFile ? examFile.name : 'Selecionar PDF'"></h3><p x-text="examFile ? (examFile.size / 1024 / 1024).toFixed(2) + ' MB' : 'Questões e alternativas'"></p><span>PDF • máximo 20 MB</span></label>
              <label :class="answerFile ? 'dropzone selected' : 'dropzone'"><input type="file" accept="application/pdf" x-on:change="answerFile = $event.target.files[0] ?? null" /><span class="upload-label">2. PDF do gabarito</span><div class="upload-icon" x-html="answerFile ? iconCheck : iconUpload"></div><h3 x-text="answerFile ? answerFile.name : 'Selecionar PDF'"></h3><p x-text="answerFile ? (answerFile.size / 1024 / 1024).toFixed(2) + ' MB' : 'Respostas oficiais'"></p><span>PDF • máximo 20 MB</span></label>
            </div>
            <div class="smart-note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8L19.7 10l-5.8 1.9L12 17.7l-1.9-5.8L4.3 10l5.8-1.9z"/></svg><div><strong x-text="loading ? (secs < 8 ? 'Lendo os PDFs' : 'Aplicando OCR quando necessário') : 'Título inteligente'"></strong><span x-text="loading ? ('Processamento em andamento • ' + fmtClock(secs)) : 'Vamos analisar o conteúdo da prova e criar um nome organizado para ela.'"></span></div></div>
            <button class="primary wide" :disabled="!examFile || !answerFile || loading" x-on:click="send()" x-text="loading ? 'Processando prova e gabarito...' : 'Gerar minha prova'"></button>
            <small class="privacy" x-text="loading ? 'Mantenha esta página aberta. PDFs escaneados podem levar alguns minutos.' : 'A prova só será criada depois que os dois arquivos forem enviados.'"></small>
          </div>
        </template>

        <!-- REVISAR -->
        <template x-if="$store.app.view === 'review' && $store.app.exam && $store.app.exam.questions">
          <div class="review-layout" x-data="reviewComponent()" x-init="init()">
            <aside class="question-list"><h3 x-text="$store.app.exam.title"></h3><p x-text="questions.length + ' questões encontradas'"></p><div class="number-grid" x-html="gridHtml"></div><button class="primary wide" x-on:click="$store.app.setView('solve')">Começar prova</button></aside>
            <section class="panel editor"><div class="editor-head"><div><span class="eyebrow" x-text="'QUESTÃO ' + question.number"></span><h2>Confira as alternativas</h2></div><span class="status">REVISÃO PENDENTE</span></div><div class="alternatives review-choices" x-html="altsHtml"></div><div class="editor-footer"><span>Clique na letra para definir o gabarito.</span><button class="primary" x-on:click="save()" x-text="saving ? 'Salvando...' : 'Salvar e avançar'"></button></div></section>
          </div>
        </template>

        <!-- RESOLVER -->
        <template x-if="$store.app.view === 'solve' && $store.app.exam">
          <div class="solve-banner"><div class="solve-banner-inner">
            <nav class="solve-crumbs" aria-label="Navegação estrutural"><button x-on:click="$store.app.setView('exams')">Início</button><span aria-hidden="true">/</span><button x-on:click="$store.app.setView('exams')">Provas</button></nav>
            <h2 x-text="$store.app.exam.title"></h2>
          </div></div>
        </template>
        <template x-if="$store.app.view === 'solve'">
          <template x-if="$store.app.exam">
            <div class="solve notranslate" translate="no" x-data="solveComponent()" x-init="init()">
              <div class="solve-workspace">
                <aside class="pdf-column">
                  <template x-if="currentPage">
                    <figure class="page-reference" x-data="pageRef()" x-init="init()">
                      <div x-ref="viewport" :class="dragging ? 'image-viewport dragging' : 'image-viewport'" x-on:pointerdown="pointerDown($event)" x-on:pointermove="pointerMove($event)" x-on:pointerup="pointerUp($event)" x-on:pointercancel="pointerUp($event)">
                        <div class="pagina-pdf" x-ref="pagina" :style="'--pdf-zoom-percent: ' + (zoom * 100) + '%; --pdf-zoom-width: ' + Math.round(960 * zoom) + 'px;'">
                          <img draggable="false" loading="lazy" decoding="async" x-bind:src="src" :alt="'Página ' + page + ' do PDF original'" x-on:load="requestAnimationFrame(() => aplicarFoco())" />
                          <div class="faixa-questao" x-ref="faixa" aria-hidden="true"></div>
                        </div>
                      </div>
                      <div class="image-toolbar">
                        <span x-text="'Zoom ' + Math.round(zoom * 100) + '%'"></span>
                        <div>
                          <button class="fit-button" x-on:click="openPdf()" x-on:mouseenter="warm()" x-on:focus="warm()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg> Página inteira</button>
                          <button class="fit-button" x-on:click="toggleFixa()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Foco</button>
                          <button aria-label="Diminuir zoom" x-on:click="changeZoom(-.25)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
                          <button aria-label="Aumentar zoom" x-on:click="changeZoom(.25)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
                          <button aria-label="Redefinir imagem" x-on:click="zoom = 1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
                        </div>
                      </div>
                    </figure>
                  </template>
                  <template x-if="!currentPage">
                    <div class="pdf-empty"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>Página original indisponível</span></div>
                  </template>
                </aside>
                <section class="question-panel">
                  <div class="question-header">
                    <h2 class="question-number" x-text="'Questão ' + question.number"></h2>
                    <div class="clock-container"><div class="clock-inner">
                      <svg class="clock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                      <span class="clock-label">TEMPO DE PROVA</span>
                      <span class="clock-time" x-data="examClock()" x-init="init()" x-text="time"></span>
                    </div></div>
                  </div>
                  <div class="question-index">
                    <div class="index-header"><span class="index-title">ÍNDICE DE QUESTÕES</span><span class="index-count" x-text="question.number + '/' + total"></span></div>
                    <div class="index-grid" x-ref="indexGrid"></div>
                  </div>
                  <div class="answer-section">
                    <h3 class="answer-title">ESCOLHA UMA RESPOSTA</h3>
                    <div id="options-host"></div>
                  </div>
                  <div :class="'bottom-nav' + (feedback ? ' feedback-active' : '')">
                    <div class="nav-arrows">
                      <button class="nav-arrow" id="prev-btn" x-on:click="goPrev()" :disabled="currentIdx === 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
                      <button class="nav-arrow" id="next-btn" x-on:click="goNext()" :disabled="currentIdx === total - 1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
                    </div>
                    <template x-if="feedback">
                      <template x-if="currentIdx === total - 1">
                        <button class="btn-respond btn-finish" id="finish-btn" x-on:click="finishExam()" :disabled="!allAnswered" x-text="allAnswered ? 'Finalizar prova' : ('Faltam ' + (total - answeredCount) + ' questões')"></button>
                      </template>
                    </template>
                    <template x-if="feedback">
                      <template x-if="currentIdx !== total - 1">
                        <button class="btn-respond" id="respond-btn" x-on:click="goNext()">Próxima</button>
                      </template>
                    </template>
                    <template x-if="!feedback">
                      <button class="btn-respond" id="respond-btn" x-on:click="submitAnswer()" :disabled="!selected || submitting" x-text="submitting ? 'Enviando...' : 'Responder'"></button>
                    </template>
                  </div>
                </section>
              </div>
            </div>
          </template>
          <template x-if="!$store.app.exam">
            <div class="panel" style="padding: 40px; text-align: center; color: #6C7480">Carregando prova...</div>
          </template>
        </template>
      </main>
    </div>
  </body>
</html>
